# SigmaOS Hyprland Monitor Configuration
# Multi-monitor support and display settings

# Example single monitor configuration (eDP-1 - laptop display)
# monitor=eDP-1,1920x1080@60,0x0,1

# Example dual monitor configuration
# monitor=DP-1,2560x1440@144,0x0,1
# monitor=eDP-1,1920x1080@60,2560,0,1

# Example with scale (for high DPI displays)
# monitor=eDP-1,2560x1600@60,0x0,1.5

# Disable built-in display when external monitor is connected
# monitor=eDP-1,disable

# Configure workspaces on specific monitors
# workspace=1,monitor:DP-1
# workspace=2,monitor:DP-1
# workspace=3,monitor:eDP-1

# Default monitor for new windows
# default_workspace_monitor=1,DP-1

# Active default monitor rule for Omarchy
monitor=,preferred,auto,1
