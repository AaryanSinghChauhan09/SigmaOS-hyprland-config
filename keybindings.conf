# SigmaOS Hyprland Keybindings
# Optimized for productivity with keyboard-driven navigation

# Terminal
bind = SUPER, Return, exec, alacritty

# Application launcher
bind = SUPER, D, exec, wofi --show drun

# Window management
bind = SUPER SHIFT, Q, killactive
bind = SUPER SHIFT, Space, togglefloating
bind = SUPER, F, fullscreen
bind = SUPER, P, pseudo

# Focus movement (vim-style)
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, k, movefocus, u
bind = SUPER, j, movefocus, d

# Window movement
bind = SUPER SHIFT, h, movewindow, l
bind = SUPER SHIFT, l, movewindow, r
bind = SUPER SHIFT, k, movewindow, u
bind = SUPER SHIFT, j, movewindow, d

# Resize windows
bind = SUPER CONTROL, h, resizeactive, -20 0
bind = SUPER CONTROL, l, resizeactive, 20 0
bind = SUPER CONTROL, k, resizeactive, 0 -20
bind = SUPER CONTROL, j, resizeactive, 0 20

# Workspace switching
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Special workspace (scratchpad)
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER SHIFT, S, movetoworkspace, special:magic
bind = SUPER ALT, S, togglespecialworkspace

# Cycle through windows
bind = SUPER, TAB, cyclenext
bind = SUPER SHIFT, TAB, cyclenext, prev

# Media keys
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ +5%
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ -5%
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshot
bind = SUPER, Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER SHIFT, Print, exec, grim - | wl-copy

# Lock screen
bind = SUPER, Escape, exec, swaylock

# Reload configuration
bind = SUPER SHIFT, R, exec, hyprctl reload

# Exit Hyprland
bind = SUPER SHIFT, E, exec, wlogout

# Application shortcuts
bind = SUPER, B, exec, firefox
bind = SUPER, N, exec, thunar
bind = SUPER, C, exec, code
bind = SUPER, T, exec, telegram-desktop
bind = SUPER, M, exec, spotify

# Group management
bind = SUPER, G, togglegroup
bind = SUPER SHIFT, G, changegroupactive
bind = SUPER ALT, left, changegroupactive, b
bind = SUPER ALT, right, changegroupactive, f

# Focus urgent window
bind = SUPER, U, focusurgent

# Move window to center
bind = SUPER, C, centerwindow
