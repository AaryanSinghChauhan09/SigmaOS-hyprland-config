# SigmaOS Hyprland Window Rules
# Ensure consistent application behavior

# Floating windows
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, class:^(org.gnome.Clocks)$
windowrulev2 = float, class:^(File-Transfer)$
windowrulev2 = float, class:^(firefox)(:.*(Library))$
windowrulev2 = float, class:^(firefox)(:.*(Preferences))$
windowrulev2 = float, class:^(firefox)(:.*(About))$

# Center floating windows
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = center, class:^(nm-connection-editor)$
windowrulev2 = center, class:^(blueman-manager)$

# Window sizes
windowrulev2 = size 800 600, class:^(pavucontrol)$
windowrulev2 = size 600 400, class:^(nm-connection-editor)$
windowrulev2 = size 400 400, class:^(org.gnome.Calculator)$

# Workspace assignments
windowrulev2 = workspace 1, class:^(firefox)$
windowrulev2 = workspace 2, class:^(code-url-handler)$
windowrulev2 = workspace 2, class:^(VSCodium)$
windowrulev2 = workspace 2, class:^(code)$
windowrulev2 = workspace 3, class:^(telegramdesktop)$
windowrulev2 = workspace 3, class:^(Slack)$
windowrulev2 = workspace 3, class:^(discord)$
windowrulev2 = workspace 4, class:^(Spotify)$
windowrulev2 = workspace 4, class:^(spotify)$
windowrulev2 = workspace 5, class:^(thunar)$
windowrulev2 = workspace 5, class:^(org.gnome.Nautilus)$
windowrulev2 = workspace 6, class:^(libreoffice)$
windowrulev2 = workspace 6, class:^(libreoffice-writer)$
windowrulev2 = workspace 6, class:^(libreoffice-calc)$

# Terminal behavior
windowrulev2 = noborder, class:^(alacritty)$
windowrulev2 = opacity 0.9, class:^(alacritty)$

# Browser behavior
windowrulev2 = opacity 0.95, class:^(firefox)$

# No blur for specific windows
windowrulev2 = noblur, class:^(firefox)$
windowrulev2 = noblur, class:^(code)$

# Keep focus on specific windows
windowrulev2 = stayfocused, class:^(firefox)$
windowrulev2 = stayfocused, class:^(code)$

# Pin windows (show on all workspaces)
windowrulev2 = pin, class:^(waybar)$

# Telegram specific rules
windowrulev2 = float, class:^(telegramdesktop)$, title:^(Media Viewer)$
windowrulev2 = float, class:^(telegramdesktop)$, title:^(Choose Chat)$

# File dialogs
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = center, class:^(xdg-desktop-portal-gtk)$
