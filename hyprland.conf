# SigmaOS Hyprland Configuration
# Omarchy Persona - Optimized for productivity and aesthetics

# Source additional configurations
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/monitors.conf

# Monitor settings
monitor=eDP-1,1920x1080@60,0x0,1

# Autostart applications
exec-once = waybar
exec-once = wallust run ~/.config/wallpaper.png
exec-once = dunst
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Environment variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Hyprcursor
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# Input settings
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
        disable_while_typing = yes
        tap-to-click = yes
    }

    sensitivity = 0
    force_no_accel = no
}

# General settings
general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(7ba6ffee)
    col.inactive_border = rgba(595f73ee)

    layout = dwindle
    allow_tearing = false
}

# Decoration settings
decoration {
    rounding = 10
    blur {
        enabled = yes
        size = 3
        passes = 2
    }

    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)
}

# Animations
animations {
    enabled = yes

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = easeOutCirc,0.075,0.82,0.165,1

    animation = windows,1,7,easeOutCubic,slide
    animation = windowsOut,1,7,easeInOutCubic,slide
    animation = border,1,10,linear
    animation = borderangle,1,8,linear
    animation = fade,1,7,decel
    animation = workspaces,1,6,easeOutQuint,slidevert
}

# Dwindle layout
dwindle {
    pseudotile = yes
    preserve_split = yes
    split_width_multiplier = 1.0
}

# Master layout
master {
    new_is_master = true
}

# Gestures
gestures {
    workspace_swipe = yes
    workspace_swipe_fingers = 3
}

# Misc settings
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = false
    no_direct_scanout = false
}

# Layer rules
layer = "^(selection)$",nofocus,forceblur
layer = "^(xdg-desktop-portal-gtk)$",nofocus,forceblur
layer = "^(waybar)$",nofocus,forceblur
